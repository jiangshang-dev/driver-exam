<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>软考AI老师在线答疑</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Helvetica Neue', Helvetica, Arial, sans-serif;
            display: flex;
            height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }

        .chat-history-list {
            width: 280px;
            min-width: 280px;
            height: 100%;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-right: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 2px 0 20px rgba(0, 0, 0, 0.1);
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            transition: all 0.3s ease;
        }

        .chat-history-list.dark {
            background: rgba(30, 35, 41, 0.95);
            border-right: 1px solid rgba(255, 255, 255, 0.1);
        }

        .chat-history-header {
            padding: 20px;
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(0, 0, 0, 0.08);
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-weight: 600;
            font-size: 16px;
            color: #2c3e50;
        }

        .chat-history-header.dark {
            background: rgba(42, 48, 58, 0.8);
            color: #e1e8ed;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .new-conv-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 500;
            margin-left: 8px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.3);
        }
        .new-conv-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.4);
        }

        .chat-main {
            flex: 1;
            height: 100%;
            display: flex;
            flex-direction: column;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(15px);
            border-radius: 20px 0 0 20px;
            margin: 10px 10px 10px 0;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            overflow: hidden;
        }

        .chat-main.dark {
            background: rgba(35, 39, 47, 0.9);
        }

        .chat-content {
            flex: 1;
            overflow-y: auto;
            padding: 30px;
            background: transparent;
            scrollbar-width: thin;
            scrollbar-color: rgba(0, 0, 0, 0.2) transparent;
        }

        .chat-content::-webkit-scrollbar {
            width: 6px;
        }

        .chat-content::-webkit-scrollbar-track {
            background: transparent;
        }

        .chat-content::-webkit-scrollbar-thumb {
            background: rgba(0, 0, 0, 0.2);
            border-radius: 3px;
        }

        .chat-content::-webkit-scrollbar-thumb:hover {
            background: rgba(0, 0, 0, 0.3);
        }

        .chat-input-area {
            padding: 20px 30px 30px 30px;
            background: rgba(255, 255, 255, 0.5);
            backdrop-filter: blur(10px);
            border-top: 1px solid rgba(0, 0, 0, 0.08);
        }
        .chat-input-area.dark {
            background: rgba(42, 48, 58, 0.5);
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }

        textarea {
            width: 100%;
            min-height: 50px;
            max-height: 200px;
            padding: 16px 20px;
            border: 2px solid rgba(102, 126, 234, 0.2);
            border-radius: 25px;
            resize: none;
            font-size: 15px;
            background: rgba(255, 255, 255, 0.8);
            color: #2c3e50;
            transition: all 0.3s ease;
            outline: none;
            font-family: inherit;
            line-height: 1.5;
        }
        textarea:focus {
            border-color: #667eea;
            background: rgba(255, 255, 255, 0.95);
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }
        textarea.dark {
            background: rgba(42, 48, 58, 0.8);
            color: #e1e8ed;
            border: 2px solid rgba(255, 255, 255, 0.1);
        }
        textarea.dark:focus {
            border-color: #667eea;
            background: rgba(42, 48, 58, 0.95);
        }

        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 25px;
            cursor: pointer;
            margin-top: 15px;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.3);
        }

        button:disabled {
            background: linear-gradient(135deg, #bdc3c7 0%, #95a5a6 100%);
            cursor: not-allowed;
            box-shadow: none;
        }

        button:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.4);
        }

        .history-list {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
        }

        .history-item {
            padding: 16px 20px;
            margin: 5px 0;
            border-radius: 12px;
            cursor: pointer;
            background: rgba(255, 255, 255, 0.6);
            transition: all 0.3s ease;
            font-size: 14px;
            color: #2c3e50;
        }

        .history-item.active, .history-item:hover {
            background: rgba(102, 126, 234, 0.1);
            transform: translateX(5px);
        }

        .history-item.dark {
            background: rgba(42, 48, 58, 0.6);
            color: #e1e8ed;
        }

        .history-item.dark.active, .history-item.dark:hover {
            background: rgba(102, 126, 234, 0.2);
        }

        .message {
            margin-bottom: 24px;
            padding: 16px 20px;
            border-radius: 18px;
            max-width: 85%;
            word-break: break-word;
            font-size: 15px;
            line-height: 1.6;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.08);
            animation: messageSlideIn 0.3s ease-out;
        }

        @keyframes messageSlideIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .user-message {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            margin-left: auto;
            text-align: left;
            border-bottom-right-radius: 6px;
        }

        .ai-message {
            background: rgba(255, 255, 255, 0.9);
            color: #2c3e50;
            border-bottom-left-radius: 6px;
            border: 1px solid rgba(0, 0, 0, 0.05);
        }

        .message.dark {
            color: #e1e8ed;
        }
        .ai-message.dark {
            background: rgba(42, 48, 58, 0.9);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .user-message.dark {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }

        .stop-btn {
            background: linear-gradient(135deg, #ff6b6b 0%, #ee5a24 100%);
            color: #fff;
            margin-left: 12px;
            padding: 12px 20px;
            box-shadow: 0 4px 15px rgba(255, 107, 107, 0.3);
        }
        .stop-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(255, 107, 107, 0.4);
        }

        .dark-toggle-btn {
            background: rgba(52, 58, 64, 0.8);
            color: #fff;
            border: none;
            padding: 8px 12px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 16px;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
        }
        .dark-toggle-btn:hover {
            background: rgba(35, 39, 47, 0.9);
            transform: scale(1.05);
        }

        /* 美化think标签的样式 */
        .think-block {
            display: flex;
            align-items: flex-start;
            background: linear-gradient(135deg, rgba(102, 126, 234, 0.1) 0%, rgba(118, 75, 162, 0.1) 100%);
            border-left: 4px solid #667eea;
            border-radius: 12px;
            padding: 16px 20px;
            margin-bottom: 16px;
            font-style: italic;
            color: #4a5568;
            font-size: 15px;
            position: relative;
            backdrop-filter: blur(5px);
            box-shadow: 0 2px 8px rgba(102, 126, 234, 0.1);
        }
        .think-block .think-icon {
            margin-right: 12px;
            font-size: 20px;
            flex-shrink: 0;
            margin-top: 2px;
            filter: drop-shadow(0 1px 2px rgba(102, 126, 234, 0.3));
        }
        .think-block.dark {
            background: linear-gradient(135deg, rgba(102, 126, 234, 0.15) 0%, rgba(118, 75, 162, 0.15) 100%);
            color: #cbd5e0;
            border-left: 4px solid #667eea;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
        }
        .think-block .think-label {
            font-weight: 600;
            margin-right: 8px;
            color: #667eea;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .think-block.dark .think-label {
            color: #a78bfa;
        }
        .ai-message-content-paragraph {
            margin-bottom: 12px;
            white-space: pre-wrap;
            word-break: break-word;
        }

        /* Markdown Table Styles */
        .ai-message-content-markdown table {
            border-collapse: collapse;
            width: 100%;
            margin-bottom: 16px;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }
        .ai-message-content-markdown th,
        .ai-message-content-markdown td {
            border: 1px solid rgba(102, 126, 234, 0.2);
            padding: 12px 16px;
            text-align: left;
        }
        .ai-message-content-markdown th {
            background: linear-gradient(135deg, rgba(102, 126, 234, 0.1) 0%, rgba(118, 75, 162, 0.1) 100%);
            font-weight: 600;
            color: #4a5568;
        }
        .ai-message-content-markdown td {
            background: rgba(255, 255, 255, 0.8);
        }
        .chat-content.dark .ai-message-content-markdown table {
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
        }
        .chat-content.dark .ai-message-content-markdown th {
            background: linear-gradient(135deg, rgba(102, 126, 234, 0.2) 0%, rgba(118, 75, 162, 0.2) 100%);
            color: #cbd5e0;
            border-color: rgba(255, 255, 255, 0.1);
        }
        .chat-content.dark .ai-message-content-markdown td {
            background: rgba(42, 48, 58, 0.8);
            color: #e1e8ed;
            border-color: rgba(255, 255, 255, 0.1);
        }
        /* Markdown code block */
        .ai-message-content-markdown pre {
            background: rgba(248, 250, 252, 0.9);
            border-radius: 12px;
            padding: 16px 20px;
            overflow-x: auto;
            margin-bottom: 16px;
            border: 1px solid rgba(102, 126, 234, 0.1);
            font-family: 'SF Mono', Monaco, 'Cascadia Code', 'Roboto Mono', Consolas, 'Courier New', monospace;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
        }
        .chat-content.dark .ai-message-content-markdown pre {
            background: rgba(42, 48, 58, 0.9);
            color: #e1e8ed;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
        }
        .ai-message-content-markdown code {
            background: rgba(102, 126, 234, 0.1);
            border-radius: 6px;
            padding: 3px 6px;
            font-size: 14px;
            font-family: 'SF Mono', Monaco, 'Cascadia Code', 'Roboto Mono', Consolas, 'Courier New', monospace;
            color: #667eea;
            font-weight: 500;
        }
        .chat-content.dark .ai-message-content-markdown code {
            background: rgba(102, 126, 234, 0.2);
            color: #a78bfa;
        }
        .ai-message-content-markdown ul,
        .ai-message-content-markdown ol {
            margin-left: 24px;
            margin-bottom: 12px;
        }
        .ai-message-content-markdown li {
            margin-bottom: 4px;
        }
        .ai-message-content-markdown blockquote {
            border-left: 4px solid #667eea;
            background: linear-gradient(135deg, rgba(102, 126, 234, 0.05) 0%, rgba(118, 75, 162, 0.05) 100%);
            color: #4a5568;
            margin: 16px 0;
            padding: 16px 20px;
            border-radius: 0 12px 12px 0;
            font-style: italic;
        }
        .chat-content.dark .ai-message-content-markdown blockquote {
            background: linear-gradient(135deg, rgba(102, 126, 234, 0.1) 0%, rgba(118, 75, 162, 0.1) 100%);
            color: #cbd5e0;
            border-left: 4px solid #667eea;
        }
        
        /* 自定义滚动条样式 */
        .history-list::-webkit-scrollbar {
            width: 6px;
        }
        .history-list::-webkit-scrollbar-track {
            background: transparent;
        }
        .history-list::-webkit-scrollbar-thumb {
            background: rgba(102, 126, 234, 0.3);
            border-radius: 3px;
        }
        .history-list::-webkit-scrollbar-thumb:hover {
            background: rgba(102, 126, 234, 0.5);
        }
        
        /* 响应式设计 */
        @media (max-width: 768px) {
            .chat-history-list {
                width: 260px;
                position: absolute;
                z-index: 1000;
                transform: translateX(-100%);
                transition: transform 0.3s ease;
            }
            
            .chat-history-list.mobile-open {
                transform: translateX(0);
            }
            
            .chat-main {
                margin: 10px;
                border-radius: 20px;
            }
        }
        
        /* 加载动画 */
        @keyframes pulse {
            0%, 100% {
                opacity: 1;
            }
            50% {
                opacity: 0.5;
            }
        }
        
        .loading-indicator {
            animation: pulse 1.5s infinite;
        }
        
        /* 消息输入框焦点增强 */
        .input-container {
            position: relative;
        }
        
        .input-container::before {
            content: '';
            position: absolute;
            top: -2px;
            left: -2px;
            right: -2px;
            bottom: -2px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            border-radius: 27px;
            opacity: 0;
            transition: opacity 0.3s ease;
            z-index: -1;
        }
        
        .input-container:focus-within::before {
            opacity: 0.2;
        }
    </style>
    <script src="js/vue.global.prod.js"></script>
    <script src="js/marked.min.js"></script>
</head>
<body>
<div id="app" style="display: flex; width: 100%; height: 100vh;">
    <div class="chat-history-list" :class="{dark: darkMode}">
        <div class="chat-history-header" :class="{dark: darkMode}">
            <span style="font-weight: 600; font-size: 16px;">💬 对话历史</span>
            <div>
                <button class="new-conv-btn" @click="startNewConversation">✨ 新对话</button>
                <button class="dark-toggle-btn" @click="toggleDarkMode">{{ darkMode ? '☀️' : '🌙' }}</button>
            </div>
        </div>
        <div class="history-list">
            <div class="history-item active" :class="{dark: darkMode}">💫 当前会话</div>
            <!-- 这里可扩展为多会话历史 -->
        </div>
    </div>
    <div class="chat-main" :class="{dark: darkMode}">
        <div class="chat-content" :class="{dark: darkMode}" ref="chatContainer">
            <div v-for="(msg, idx) in messages" :key="idx"
                 class="message"
                 :class="[
                    msg.role === 'user' ? 'user-message' : 'ai-message',
                    darkMode ? 'dark' : ''
                 ]">
                <template v-if="msg.role === 'assistant'">
                    <span v-if="msg.isLoading || msg.isStreaming" class="loading-indicator">
                        <template v-if="msg.content.slice(0, msg.visibleChars).includes('<think>')">
                            <ai-message-content
                                    :content="msg.content.slice(0, msg.visibleChars)"
                                    :dark="darkMode"
                            ></ai-message-content>
                        </template>
                        <template v-else>
                            <ai-message-content
                                    :content="msg.content.slice(0, msg.visibleChars)"
                                    :dark="darkMode"
                            ></ai-message-content>
                        </template>
                        <span v-if="msg.isLoading || msg.isStreaming" style="opacity:0.7; font-size: 18px;">💭</span>
                    </span>
                    <span v-else>
                        <template v-if="msg.content.includes('<think>')">
                            <ai-message-content
                                    :content="msg.content"
                                    :dark="darkMode"
                            ></ai-message-content>
                        </template>
                        <template v-else>
                            <ai-message-content
                                    :content="msg.content"
                                    :dark="darkMode"
                            ></ai-message-content>
                        </template>
                    </span>
                </template>
                <template v-else>
                    <div style="display: flex; align-items: center; gap: 8px;">
                        <span style="font-size: 16px;">👤</span>
                        <span>{{ msg.content }}</span>
                    </div>
                </template>
            </div>
        </div>
        <div class="chat-input-area" :class="{dark: darkMode}">
            <div class="input-container">
                <textarea
                        ref="textarea"
                        :class="{dark: darkMode}"
                        v-model="userInput"
                        :disabled="isLoading"
                        placeholder="💬 请输入您的问题..."
                        @input="adjustTextareaHeight"
                        @keydown.enter.exact.prevent="sendMessage"
                        rows="2"
                        style="overflow-y: auto;"
                ></textarea>
            </div>
            <div style="display: flex; align-items: center; justify-content: space-between;">
                <div style="display: flex; align-items: center;">
                    <button @click="sendMessage" :disabled="!userInput.trim() || isLoading">
                        {{ isLoading ? '✨ 思考中...' : '🚀 发送' }}
                    </button>
                    <button class="stop-btn" v-if="isLoading" @click="stopResponse">⏹️ 停止</button>
                </div>
                <div style="font-size: 12px; color: #94a3b8; font-style: italic;">
                    Press Enter to send • Shift+Enter for new line
                </div>
            </div>
        </div>
    </div>
</div>
<script>
    const { createApp, ref, nextTick, onMounted, watch, defineComponent, h } = Vue;

    // 解析AI消息内容，将think标签和正文分段渲染，并兼容markdown
    const AiMessageContent = {
        name: 'AiMessageContent',
        props: {
            content: String,
            dark: Boolean
        },
        computed: {
            parsedBlocks() {
                // 支持多段think和正文混合
                const blocks = [];
                let text = this.content || '';
                let lastIndex = 0;
                const thinkOpen = '<think>';
                const thinkClose = '</think>';
                while (true) {
                    const start = text.indexOf(thinkOpen, lastIndex);
                    if (start === -1) {
                        // 剩余正文
                        const rest = text.slice(lastIndex);
                        if (rest.trim() !== '') {
                            blocks.push({ type: 'text', content: rest });
                        }
                        break;
                    }
                    // 前面正文
                    if (start > lastIndex) {
                        const before = text.slice(lastIndex, start);
                        if (before.trim() !== '') {
                            blocks.push({ type: 'text', content: before });
                        }
                    }
                    const end = text.indexOf(thinkClose, start + thinkOpen.length);
                    if (end === -1) {
                        // 没有闭合，全部算正文
                        const rest = text.slice(start);
                        if (rest.trim() !== '') {
                            blocks.push({ type: 'text', content: rest });
                        }
                        break;
                    }
                    // think内容
                    const thinkContent = text.slice(start + thinkOpen.length, end);
                    blocks.push({ type: 'think', content: thinkContent });
                    lastIndex = end + thinkClose.length;
                }
                return blocks;
            }
        },
        methods: {
            renderMarkdown(content) {
                // 使用 marked 解析 markdown
                if (window.marked) {
                    return marked.parse(content, { breaks: true });
                }
                // fallback: 转义
                return content.replace(/[<>&"]/g, function(c) {
                    return {'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[c];
                });
            }
        },
        render() {
            return h('div', {}, this.parsedBlocks.map((block, i) => {
                if (block.type === 'think') {
                    return h('div', {
                        class: ['think-block', this.dark ? 'dark' : ''],
                    }, [
                        h('span', { class: 'think-icon', title: '思考' }, '💡'),
                        h('span', { class: 'think-label' }, '思考'),
                        h('span', {}, block.content.trim())
                    ]);
                } else {
                    // 正文段落，支持markdown
                    return h('div', {
                        class: ['ai-message-content-markdown'],
                        innerHTML: this.renderMarkdown(block.content.trim())
                    });
                }
            }));
        }
    };

    createApp({
        components: {
            AiMessageContent
        },
        setup() {
            const messages = ref([]);
            const userInput = ref('');
            const isLoading = ref(false);
            const chatContainer = ref(null);
            const textarea = ref(null);
            const darkMode = ref(false);
            const memoeryId = ref(Date.now().toString());
            let controller = null;
            let typingInterval = null;

            // 调整文本区域高度
            const adjustTextareaHeight = () => {
                const textareaEl = textarea.value;
                if (!textareaEl) return;
                textareaEl.style.height = 'auto';
                textareaEl.style.height = `${Math.min(textareaEl.scrollHeight, 200)}px`;
            };

            // 滚动到底部
            const scrollToBottom = () => {
                nextTick(() => {
                    if (chatContainer.value) {
                        chatContainer.value.scrollTop = chatContainer.value.scrollHeight;
                    }
                });
            };

            // 切换暗黑模式
            const toggleDarkMode = () => {
                darkMode.value = !darkMode.value;
                localStorage.setItem('darkMode', darkMode.value);
            };

            // 新建会话
            const startNewConversation = () => {
                messages.value = [];
                // 实际项目中应该改为用户id
                memoeryId.value = Date.now().toString();
                messages.value.push({
                    role: 'assistant',
                    content: '你好！我是您的专业AI技术顾问 🤖，很高兴为您服务！请问有什么技术问题需要我帮助解答吗？',
                    isLoading: false,
                    visibleChars: 0,
                    isStreaming: false
                });
                messages.value[0].visibleChars = messages.value[0].content.length;
                scrollToBottom();
                nextTick(() => {
                    if (textarea.value) textarea.value.focus();
                    adjustTextareaHeight();
                });
            };

            // 模拟逐字打印效果
            const startTypingEffect = (messageIndex) => {
                const message = messages.value[messageIndex];
                if (!message || message.visibleChars >= message.content.length) {
                    clearInterval(typingInterval);
                    typingInterval = null;
                    messages.value[messageIndex].isStreaming = false;
                    return;
                }
                messages.value[messageIndex].visibleChars++;
                scrollToBottom();
            };

            // 发送消息
            const sendMessage = async () => {
                if (!userInput.value.trim() || isLoading.value) return;
                if (controller) {
                    controller.abort();
                }
                controller = new AbortController();
                const userMessage = {
                    role: 'user',
                    content: userInput.value.trim(),
                    isLoading: false,
                    visibleChars: userInput.value.trim().length,
                    isStreaming: false
                };
                messages.value.push(userMessage);
                const assistantMessage = {
                    role: 'assistant',
                    content: '',
                    isLoading: true,
                    visibleChars: 0,
                    isStreaming: true
                };
                messages.value.push(assistantMessage);
                userInput.value = '';
                adjustTextareaHeight();
                scrollToBottom();
                isLoading.value = true;
                try {
                    const response = await fetch(`/chat?message=${encodeURIComponent(userMessage.content)}&memoryId=${memoeryId.value}`, {
                        signal: controller.signal
                    });
                    if (!response.ok) {
                        throw new Error(`HTTP error! status: ${response.status}`);
                    }
                    const reader = response.body.getReader();
                    const decoder = new TextDecoder('utf-8');
                    let buffer = '';
                    let messageIndex = messages.value.length - 1;
                    if (typingInterval) {
                        clearInterval(typingInterval);
                        typingInterval = null;
                    }
                    while (true) {
                        const { done, value } = await reader.read();
                        if (done) break;
                        const chunk = decoder.decode(value, { stream: true });
                        buffer += chunk;
                        messages.value[messageIndex].content = buffer;
                        messages.value[messageIndex].isLoading = false;
                        if (!typingInterval) {
                            typingInterval = setInterval(() => {
                                startTypingEffect(messageIndex);
                            }, 20);
                        }
                        scrollToBottom();
                    }
                } catch (error) {
                    if (error.name === 'AbortError') {
                        console.log('请求被用户中止');
                    } else {
                        console.error('请求出错:', error);
                        const lastMessage = messages.value[messages.value.length - 1];
                        lastMessage.content = '抱歉，请求过程中出现错误: ' + error.message;
                        lastMessage.visibleChars = lastMessage.content.length;
                    }
                } finally {
                    const lastMessage = messages.value[messages.value.length - 1];
                    lastMessage.isLoading = false;
                    lastMessage.isStreaming = false;
                    if (lastMessage.visibleChars < lastMessage.content.length) {
                        lastMessage.visibleChars = lastMessage.content.length;
                    }
                    isLoading.value = false;
                    controller = null;
                    if (typingInterval) {
                        clearInterval(typingInterval);
                        typingInterval = null;
                    }
                    scrollToBottom();
                }
            };

            // 停止响应
            const stopResponse = () => {
                if (controller) {
                    controller.abort();
                    const lastMessage = messages.value[messages.value.length - 1];
                    lastMessage.isLoading = false;
                    lastMessage.isStreaming = false;
                    if (lastMessage.visibleChars < lastMessage.content.length) {
                        lastMessage.visibleChars = lastMessage.content.length;
                    }
                    isLoading.value = false;
                    controller = null;
                    if (typingInterval) {
                        clearInterval(typingInterval);
                        typingInterval = null;
                    }
                }
            };

            // 初始化
            onMounted(() => {
                darkMode.value = localStorage.getItem('darkMode') === 'true'
                    || (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
                messages.value.push({
                    role: 'assistant',
                    content: '你好！我是阿里巴巴P8高级技术专家的专业AI智能顾问小甲 🤖，很高兴为您服务！请问有什么技术问题需要我帮助解答吗？',
                    isLoading: false,
                    visibleChars: 0,
                    isStreaming: false
                });
                messages.value[0].visibleChars = messages.value[0].content.length;
                scrollToBottom();
                nextTick(() => {
                    if (textarea.value) textarea.value.focus();
                    adjustTextareaHeight();
                });
            });

            // 监听消息变化自动滚动
            watch(messages, scrollToBottom, { deep: true });

            return {
                messages,
                userInput,
                isLoading,
                darkMode,
                chatContainer,
                textarea,
                sendMessage,
                stopResponse,
                toggleDarkMode,
                adjustTextareaHeight,
                startNewConversation
            };
        }
    }).mount('#app');
</script>
