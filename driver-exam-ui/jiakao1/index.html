<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>驾考通 - 专业驾考学习平台</title>
    <link rel="stylesheet" href="css/common.css">
    <link rel="stylesheet" href="css/index.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <!-- 顶部导航栏 -->
    <header class="header">
        <div class="header-content">
            <h1 class="logo">驾考通</h1>
            <div class="header-right">
                <i class="fas fa-search search-icon"></i>
                <i class="fas fa-user-circle profile-icon" onclick="goToProfile()"></i>
            </div>
        </div>
    </header>

    <!-- 主要内容区域 -->
    <main class="main-content">
        <!-- 轮播图区域 -->
        <section class="banner-section">
            <div class="banner">
                <div class="banner-item active">
                    <img src="https://via.placeholder.com/350x150/4CAF50/white?text=VIP会员特惠" alt="VIP特惠">
                    <div class="banner-text">
                        <h3>VIP会员限时特惠</h3>
                        <p>解锁全部视频教程</p>
                    </div>
                </div>
            </div>
        </section>

        <!-- 功能模块网格 -->
        <section class="function-grid">
            <div class="grid-item" onclick="goToVideos()">
                <i class="fas fa-play-circle"></i>
                <span>交规视频</span>
                <div class="vip-badge">VIP</div>
            </div>
            <div class="grid-item" onclick="goToQuestions()">
                <i class="fas fa-edit"></i>
                <span>驾考刷题</span>
            </div>
            <div class="grid-item" onclick="goToExam()">
                <i class="fas fa-clipboard-check"></i>
                <span>模拟考试</span>
            </div>
            <div class="grid-item" onclick="goToWrongQuestions()">
                <i class="fas fa-exclamation-triangle"></i>
                <span>错题本</span>
            </div>
            <div class="grid-item" onclick="goToFavorites()">
                <i class="fas fa-heart"></i>
                <span>我的收藏</span>
            </div>
            <div class="grid-item" onclick="goToPoints()">
                <i class="fas fa-coins"></i>
                <span>我的积分</span>
            </div>
        </section>

        <!-- 推荐内容 -->
        <section class="recommended-section">
            <h2 class="section-title">热门推荐</h2>
            <div class="video-list">
                <div class="video-item" onclick="playVideo(1)">
                    <img src="https://via.placeholder.com/120x80/2196F3/white?text=视频1" alt="交规视频">
                    <div class="video-info">
                        <h4>交通标志详解</h4>
                        <p>学习时长: 15分钟</p>
                        <div class="video-stats">
                            <span><i class="fas fa-thumbs-up"></i> 1.2k</span>
                            <span><i class="fas fa-heart"></i> 856</span>
                        </div>
                    </div>
                    <div class="vip-overlay">
                        <i class="fas fa-lock"></i>
                        <span>VIP专享</span>
                    </div>
                </div>
                <div class="video-item" onclick="playVideo(2)">
                    <img src="https://via.placeholder.com/120x80/FF9800/white?text=视频2" alt="交规视频">
                    <div class="video-info">
                        <h4>科目一技巧总结</h4>
                        <p>学习时长: 20分钟</p>
                        <div class="video-stats">
                            <span><i class="fas fa-thumbs-up"></i> 2.1k</span>
                            <span><i class="fas fa-heart"></i> 1.3k</span>
                        </div>
                    </div>
                    <div class="vip-overlay">
                        <i class="fas fa-lock"></i>
                        <span>VIP专享</span>
                    </div>
                </div>
            </div>
        </section>

        <!-- 学习进度 -->
        <section class="progress-section">
            <h2 class="section-title">学习进度</h2>
            <div class="progress-card">
                <div class="progress-item">
                    <span class="progress-label">科目一</span>
                    <div class="progress-bar">
                        <div class="progress-fill" style="width: 75%"></div>
                    </div>
                    <span class="progress-percent">75%</span>
                </div>
                <div class="progress-item">
                    <span class="progress-label">科目四</span>
                    <div class="progress-bar">
                        <div class="progress-fill" style="width: 45%"></div>
                    </div>
                    <span class="progress-percent">45%</span>
                </div>
            </div>
        </section>
    </main>

    <!-- 底部导航栏 -->
    <nav class="bottom-nav">
        <div class="nav-item active" onclick="switchTab('home')">
            <i class="fas fa-home"></i>
            <span>首页</span>
        </div>
        <!-- <div class="nav-item" onclick="switchTab('study')">
            <i class="fas fa-book"></i>
            <span>学习</span>
        </div>
        <div class="nav-item" onclick="switchTab('exam')">
            <i class="fas fa-clipboard-list"></i>
            <span>考试</span>
        </div> -->
        <div class="nav-item" onclick="switchTab('profile')">
            <i class="fas fa-user"></i>
            <span>我的</span>
        </div>
    </nav>

    <!-- VIP会员弹窗 -->
    <div id="vipModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>开通VIP会员</h3>
                <span class="close" onclick="closeModal()">&times;</span>
            </div>
            <div class="modal-body">
                <div class="vip-benefits">
                    <h4>VIP专享特权</h4>
                    <ul>
                        <li><i class="fas fa-check"></i> 解锁全部交规视频</li>
                        <li><i class="fas fa-check"></i> 无限制刷题练习</li>
                        <li><i class="fas fa-check"></i> 专业错题分析</li>
                        <li><i class="fas fa-check"></i> 优先客服支持</li>
                    </ul>
                </div>
                <div class="vip-plans">
                    <div class="plan-item">
                        <h5>月卡</h5>
                        <p class="price">￥29.9</p>
                    </div>
                    <div class="plan-item recommended">
                        <h5>年卡</h5>
                        <p class="price">￥199.9</p>
                        <span class="discount">省60%</span>
                    </div>
                </div>
                <button class="vip-btn">立即开通</button>
            </div>
        </div>
    </div>

    <script src="js/common.js"></script>
    <script src="js/index.js"></script>
</body>
</html>
