<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>驾考通 - 项目启动页</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .container {
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            max-width: 600px;
            width: 100%;
            text-align: center;
        }
        
        .logo {
            font-size: 48px;
            font-weight: bold;
            color: #667eea;
            margin-bottom: 20px;
        }
        
        .subtitle {
            font-size: 18px;
            color: #666;
            margin-bottom: 40px;
        }
        
        .pages-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }
        
        .page-card {
            background: #f8f9fa;
            border-radius: 15px;
            padding: 30px 20px;
            text-decoration: none;
            color: #333;
            transition: all 0.3s ease;
            border: 2px solid transparent;
        }
        
        .page-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            border-color: #667eea;
        }
        
        .page-icon {
            font-size: 32px;
            color: #667eea;
            margin-bottom: 15px;
        }
        
        .page-title {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 8px;
        }
        
        .page-desc {
            font-size: 12px;
            color: #666;
        }
        
        .features {
            background: #f8f9fa;
            border-radius: 15px;
            padding: 30px;
            margin-bottom: 30px;
        }
        
        .features h3 {
            color: #333;
            margin-bottom: 20px;
            font-size: 18px;
        }
        
        .features-list {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 15px;
            text-align: left;
        }
        
        .feature-item {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 14px;
            color: #666;
        }
        
        .feature-icon {
            color: #4CAF50;
            font-size: 16px;
        }
        
        .tech-info {
            font-size: 14px;
            color: #999;
            line-height: 1.6;
        }
        
        @media (max-width: 768px) {
            .container {
                padding: 30px 20px;
            }
            
            .logo {
                font-size: 36px;
            }
            
            .subtitle {
                font-size: 16px;
            }
            
            .pages-grid {
                grid-template-columns: 1fr;
            }
            
            .features-list {
                grid-template-columns: 1fr;
            }
        }
    </style>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div class="container">
        <div class="logo">驾考通</div>
        <div class="subtitle">专业驾考学习平台原型</div>
        
        <div class="pages-grid">
            <a href="index.html" class="page-card">
                <div class="page-icon">
                    <i class="fas fa-home"></i>
                </div>
                <div class="page-title">首页</div>
                <div class="page-desc">应用主页，功能导航</div>
            </a>
            
            <a href="videos.html" class="page-card">
                <div class="page-icon">
                    <i class="fas fa-play-circle"></i>
                </div>
                <div class="page-title">交规视频</div>
                <div class="page-desc">VIP视频课程学习</div>
            </a>
            
            <a href="questions.html" class="page-card">
                <div class="page-icon">
                    <i class="fas fa-edit"></i>
                </div>
                <div class="page-title">驾考刷题</div>
                <div class="page-desc">按题型分类练习</div>
            </a>
            
            <a href="exam.html" class="page-card">
                <div class="page-icon">
                    <i class="fas fa-clipboard-check"></i>
                </div>
                <div class="page-title">模拟考试</div>
                <div class="page-desc">真实考试环境模拟</div>
            </a>
            
            <a href="profile.html" class="page-card">
                <div class="page-icon">
                    <i class="fas fa-user"></i>
                </div>
                <div class="page-title">个人中心</div>
                <div class="page-desc">用户信息和设置</div>
            </a>
        </div>
        
        <div class="features">
            <h3>功能特色</h3>
            <div class="features-list">
                <div class="feature-item">
                    <i class="fas fa-check feature-icon"></i>
                    <span>VIP会员视频课程</span>
                </div>
                <div class="feature-item">
                    <i class="fas fa-check feature-icon"></i>
                    <span>智能刷题系统</span>
                </div>
                <div class="feature-item">
                    <i class="fas fa-check feature-icon"></i>
                    <span>模拟考试评分</span>
                </div>
                <div class="feature-item">
                    <i class="fas fa-check feature-icon"></i>
                    <span>多种登录方式</span>
                </div>
                <div class="feature-item">
                    <i class="fas fa-check feature-icon"></i>
                    <span>移动端适配</span>
                </div>
                <div class="feature-item">
                    <i class="fas fa-check feature-icon"></i>
                    <span>现代化UI设计</span>
                </div>
                <div class="feature-item">
                    <i class="fas fa-check feature-icon"></i>
                    <span>点赞收藏互动</span>
                </div>
                <div class="feature-item">
                    <i class="fas fa-check feature-icon"></i>
                    <span>积分系统</span>
                </div>
            </div>
        </div>
        
        <div class="tech-info">
            <p><strong>技术栈：</strong>HTML5 + CSS3 + JavaScript ES6</p>
            <p><strong>特点：</strong>响应式设计，移动端优化，无需构建工具</p>
            <p><strong>建议：</strong>使用Chrome浏览器获得最佳体验</p>
        </div>
    </div>
</body>
</html>
