version: '2'
services:
  driver-admin:
    container_name: "driver-admin-app"
    image: 'driver/driver-admin:latest'
    ports:
    - "9090:9090"
    environment:
    - spring.profiles.active=dev
    build:
      context: back
      dockerfile: Dockerfile
    working_dir: /data
    networks:
      - my-network
  driver-api:
    container_name: "driver-api-app"
    image: 'driver/driver-api:latest'
    ports:
      - "8089:8089"
    environment:
      - spring.profiles.active=dev
    build:
      context: back-api
      dockerfile: Dockerfile
    working_dir: /data
    networks:
      - my-network
  driver-web:
    container_name: "driver-ui-app"
    image: 'driver/driver-ui:latest'
    ports:
    - "8082:8081"
    build:
      context: front
      dockerfile: Dockerfile
    networks:
      - my-network

networks:
  my-network:
    driver: bridge

