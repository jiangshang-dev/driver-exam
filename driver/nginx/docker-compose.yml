version: '3'

networks:
  my-network:  # 自定义网络，容器间通过服务名通信

services:
  nginx:
    image: nginx:latest
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # 挂载 nginx.conf 到容器内的默认配置路径
      - /home/software/nginx2/webserver/nginx/conf/nginx.conf:/etc/nginx/nginx.conf:ro
      # 挂载证书文件（对应你配置中的 /home/software/nginx 路径）
      - /home/software/nginx:/home/software/nginx:ro
      # 挂载静态文件目录（对应配置中的 /home/web）
      - /home/web:/home/web:ro
      # 挂载验证文件目录（对应配置中的 /home/software/nginx2/webserver/nginx/conf）
      - /home/software/nginx2/webserver/nginx/conf:/home/software/nginx2/webserver/nginx/conf:ro
    depends_on:
      - backend  # 后端服务容器名（需与你的后端服务名一致）
    networks:
      - my-network

  backend:  # 后端服务容器（示例）
    image: driver-exam-api:latest  # 替换为实际后端镜像
    ports:
      - "8089:8089"  # 可选：暴露端口到主机
    networks:
      - my-network

  file-service:  # 另一个后端服务（示例）
    image: your-file-service-image:latest
    ports:
      - "8891:8891"
    networks:
      - my-network